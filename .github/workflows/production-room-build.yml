name: Production Room Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore patched Media3
        run: |
          set -euo pipefail
          MEDIA3_SHA=b0cfc8c399fed33a0f9e464fbc03a9c60a195599
          git clone --no-checkout https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          git -C /tmp/media3-patched fetch --depth 1 origin "$MEDIA3_SHA"
          git -C /tmp/media3-patched checkout --detach "$MEDIA3_SHA"
          test -f /tmp/media3-patched/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java
      - name: Build default debug
        run: ./gradlew :app:assembleDefaultDebug --no-daemon --no-watch-fs --stacktrace --max-workers=1
      - name: Locate APK
        id: locate_apk
        shell: bash
        run: |
          set -euo pipefail
          echo "Built APK files:"
          find app/build/outputs/apk -type f -name '*.apk' -print
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: assembleDefaultDebug completed but no APK was found under app/build/outputs/apk"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FadCam-default-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.locate_apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release edit latest-debug --target "$GITHUB_SHA" --title "FadCam Latest Debug APK" --prerelease
          else
            gh release create latest-debug \
              --target "$GITHUB_SHA" \
              --title "FadCam Latest Debug APK" \
              --notes "Automatically published debug APK from the latest successful Production Room Build." \
              --prerelease
          fi
          gh release upload latest-debug "$APK_PATH#FadCam-default-debug.apk" --clobber
