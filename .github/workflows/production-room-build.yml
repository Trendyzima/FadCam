name: Production Room Build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore patched Media3
        run: |
          set -euo pipefail
          MEDIA3_SHA=b0cfc8c399fed33a0f9e464fbc03a9c60a195599
          git clone --no-checkout https://github.com/anonfaded/media3-patched.git /tmp/media3-patched
          git -C /tmp/media3-patched fetch --depth 1 origin "$MEDIA3_SHA"
          git -C /tmp/media3-patched checkout --detach "$MEDIA3_SHA"
          test -f /tmp/media3-patched/libraries/muxer/src/main/java/androidx/media3/muxer/ProcessedSegment.java
      - name: Build default debug
        run: ./gradlew :app:assembleDefaultDebug --no-daemon --no-watch-fs --stacktrace --max-workers=1
      - name: Locate APK
        id: locate_apk
        shell: bash
        run: |
          set -euo pipefail
          echo "Built APK files:"
          find app/build/outputs/apk -type f -name '*.apk' -print
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: assembleDefaultDebug completed but no APK was found under app/build/outputs/apk"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FadCam-default-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK download entry to README
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          start = '<!-- FADCAM-APK-DOWNLOAD:START -->'
          end = '<!-- FADCAM-APK-DOWNLOAD:END -->'
          block = f'''{start}\n## `>_` 📦 Latest Debug APK\n\n[![Download Latest APK](https://img.shields.io/badge/Download-Latest%20APK-brightgreen?logo=android)]({os.environ["RUN_URL"]})\n\nThe latest successful production-room debug APK is published as the **FadCam-default-debug-apk** artifact on GitHub Actions. Open the build page above and download the APK from **Artifacts**.\n{end}'''
          if start in text and end in text:
              a = text.index(start)
              b = text.index(end, a) + len(end)
              text = text[:a] + block + text[b:]
          else:
              text = text.rstrip() + '\n\n' + block + '\n'
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'README already contains the current APK download entry.'
            exit 0
          fi
          git commit -m "docs: publish latest APK download link"
          git push
